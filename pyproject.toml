[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musetalk-mlx"
version = "0.1.0"
description = "MuseTalk 1.5 lip-sync digital human on Apple Silicon — business layer over fusion-mlx (K12 English teacher, LiveKit)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Neural core (UNet / SD-VAE / Whisper-tiny + MuseTalkPipeline) lives in the
# fusion-mlx foundation: fusion_mlx.video.musetalk_mlx. The [video] extra
# brings opencv/librosa/imageio.
#
# P0-9: the hardcoded file:///Users/dahai/... local pin made the wheel
# non-installable on any other machine and leaked an absolute path into
# metadata. Dev installs against a local fusion-mlx checkout now go through the
# FUSION_MLX_PATH env var (see Makefile / install instructions); published
# wheels depend on the versioned PyPI spec below. The env-driven local pin is
# injected at install time by setup.py, NOT baked into static metadata.
dependencies = [
    # Upper bound: musetalk-mlx reaches into fusion-mlx internals (UNET_TIMESTEP,
    # apply_pe, pipe._dtype/unet/vae/scaling_factor) that are NOT a public
    # contract. A minor bump that renames any of these silently breaks the
    # session. Pin <0.11 until fusion-mlx promotes these to a stable surface
    # (tracked upstream); bump the upper bound only after an integration sweep.
    "fusion-mlx[video]>=0.10.2,<0.11",
]

[project.optional-dependencies]
livekit = [
    "livekit>=1.0",
    "livekit-api>=1.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "scikit-image>=0.22",
]
eval = [
    # Offline quality evaluation (LSE-C/LSE-D/CSIM). Runs in a torch env,
    # NOT the torch-free realtime path — documented as a separate extra so a
    # torch-free terminal install does not pull torch/insightface (audit P2).
    "torch>=2.0",
    "insightface>=0.7",
    "scikit-image>=0.22",
    "librosa>=0.10",
]

[project.scripts]
musetalk-mlx-offline = "musetalk_mlx.tools.offline_infer:main"
musetalk-mlx-realtime = "musetalk_mlx.tools.realtime_infer:main"
musetalk-mlx-convert = "musetalk_mlx.tools.convert_weights:main"
musetalk-mlx-stress = "musetalk_mlx.tools.stress:main"
musetalk-mlx-benchmark = "musetalk_mlx.tools.benchmark:main"
musetalk-mlx-eval = "musetalk_mlx.tools.eval:main"
musetalk-mlx-gen-gt = "musetalk_mlx.tools.gen_gt:main"

[tool.setuptools.packages.find]
include = ["musetalk_mlx*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
